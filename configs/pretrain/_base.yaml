# Shared pretraining defaults. Other recipes `extends:` this file and override
# only what differs, so a size-specific recipe stays a dozen lines.

run_name: pretrain
tokenizer: artifacts/tokenizer.json

model:
  template: dense_12m

data:
  train: data/tokenized/train
  eval: data/tokenized/eval

training:
  # Schedule
  max_steps: 20000
  batch_size: 32
  seq_len: 512
  grad_accum_steps: 1

  # Optimization
  optimizer: adamw
  lr: 1.0e-3
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0
  lr_schedule: cosine
  warmup: 0.02          # fraction of max_steps, or an absolute step count
  min_lr_ratio: 0.1

  # Hardware
  device: auto
  dtype: auto           # bf16 on capable GPUs, fp32 otherwise
  compile: false
  num_workers: 2

  # Cadence
  log_every: 20
  eval_every: 500
  eval_batches: 20
  save_every: 1000
  keep_last: 3
  keep_best: 1
  monitor: val_loss

  seed: 1337
  resume: true

# Printed during evaluation so you can see what the model sounds like.
sample_prompt: "The river runs"
export: true
