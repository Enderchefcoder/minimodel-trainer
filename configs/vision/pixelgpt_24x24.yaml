# The flagship pixel-art model: 24x24 sprites, ~10M parameters, exact palette.
#
#   minimodel vision data prepare --dataset pixelgpt-24x24 --mode palette \
#       --size 24 --palette-size 64 -o data/images/sprites
#   minimodel vision train --config configs/vision/pixelgpt_24x24.yaml
#   minimodel vision sample -m runs/pixelgpt-24x24/model -n 16 -o sprites.png

kind: pixelgpt
run_name: pixelgpt-24x24

model:
  template: pixelgpt_24x24_10m

data:
  train: data/images/sprites
  eval: data/images/sprites-val

training:
  max_steps: 20000
  batch_size: 64
  seq_len: 576            # 24 * 24
  lr: 6.0e-4
  weight_decay: 0.05
  warmup: 0.03
  lr_schedule: cosine
  grad_clip: 1.0

  # Sprites are almost always vertically symmetric, so flipping is free data.
  horizontal_flip: true

  log_every: 50
  eval_every: 500
  save_every: 2000
  seed: 1337
