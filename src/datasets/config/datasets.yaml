# Text dataset registry.
#
# Each entry is a *recipe*, not a copy of the data: it records where the corpus
# lives, which field holds the text, what stage of training it belongs to, and
# roughly how big it is. `minimodel data pull <name>` materialises one; the
# `mixtures` section at the bottom composes them into training blends.
#
# Field reference
#   source       huggingface | url | local | builtin
#   repo         Hugging Face dataset id (source: huggingface)
#   config       dataset configuration / subset name
#   split        split expression, e.g. "train" or "train[:5%]"
#   text_field   column holding raw text (pretraining corpora)
#   stage        pretrain | sft | cot | preference | rlvr | eval
#   format       text | chat | instruction | preference | verifiable
#   tokens       rough token count, for planning mixtures
#   license      upstream license; always check before publishing a model
#
# Adding your own: append an entry here, or point `minimodel data pull` at a
# local JSONL file with `--source local --path mydata.jsonl`.

version: 1

datasets:
  # ==========================================================================
  # Pretraining - web / educational
  # ==========================================================================
  fineweb-edu-dedup:
    source: huggingface
    repo: HuggingFaceTB/smollm-corpus
    config: fineweb-edu-dedup
    split: train
    text_field: text
    stage: pretrain
    format: text
    tokens: 220B
    license: odc-by
    description: >-
      Educational subset of FineWeb, deduplicated. The single best general
      pretraining corpus for small models: the education filter removes most of
      the web noise that a small model cannot afford to memorise.

  cosmopedia-v2:
    source: huggingface
    repo: HuggingFaceTB/smollm-corpus
    config: cosmopedia-v2
    split: train
    text_field: text
    stage: pretrain
    format: text
    tokens: 28B
    license: apache-2.0
    description: >-
      Synthetic textbooks, blog posts and stories generated by Mixtral. Very
      high signal per token; mixing 20-40% of this into web data reliably beats
      web-only at the same token budget for models under ~500M params.

  python-edu:
    source: huggingface
    repo: HuggingFaceTB/smollm-corpus
    config: python-edu
    split: train
    text_field: text
    stage: pretrain
    format: text
    tokens: 4B
    license: odc-by
    description: Educational Python from The Stack. Adds code ability cheaply.

  fineweb-edu-10bt:
    source: huggingface
    repo: HuggingFaceFW/fineweb-edu
    config: sample-10BT
    split: train
    text_field: text
    stage: pretrain
    format: text
    tokens: 10B
    license: odc-by
    description: A 10B-token sample of FineWeb-Edu. Good default for a first real run.

  fineweb-edu-350bt:
    source: huggingface
    repo: HuggingFaceFW/fineweb-edu
    config: sample-350BT
    split: train
    text_field: text
    stage: pretrain
    format: text
    tokens: 350B
    license: odc-by
    description: Larger FineWeb-Edu sample for models above ~150M params.

  dclm-100bt:
    source: huggingface
    repo: HuggingFaceFW/dclm_100BT
    split: train
    text_field: text
    stage: pretrain
    format: text
    tokens: 100B
    license: odc-by
    description: >-
      ~100B-token English subset of DCLM-Baseline. Complements FineWeb-Edu:
      stronger on HellaSwag / commonsensical conversational text (SmolLM2).

  finemath:
    source: huggingface
    repo: HuggingFaceTB/finemath
    config: finemath-4plus
    split: train
    text_field: text
    stage: pretrain
    format: text
    tokens: 10B
    license: odc-by
    description: >-
      Math-heavy web text, quality-filtered. Small models gain a lot of
      arithmetic and symbolic ability from a 5-10% math slice.

  open-web-math:
    source: huggingface
    repo: open-web-math/open-web-math
    split: train
    text_field: text
    stage: pretrain
    format: text
    tokens: 15B
    license: odc-by
    description: Mathematical web documents with LaTeX preserved.

  starcoder-python:
    source: huggingface
    repo: bigcode/starcoderdata
    config: python
    split: train
    text_field: content
    stage: pretrain
    format: text
    tokens: 60B
    license: other
    description: Permissively-licensed Python source. Use a slice; the full set is huge.

  wikipedia-en:
    source: huggingface
    repo: wikimedia/wikipedia
    config: 20231101.en
    split: train
    text_field: text
    stage: pretrain
    format: text
    tokens: 6B
    license: cc-by-sa-3.0
    description: English Wikipedia. Dense factual text; good for knowledge probes.

  simple-wikipedia:
    source: huggingface
    repo: wikimedia/wikipedia
    config: 20231101.simple
    split: train
    text_field: text
    stage: pretrain
    format: text
    tokens: 0.1B
    license: cc-by-sa-3.0
    description: >-
      Simple English Wikipedia. Short sentences and a small vocabulary make this
      an excellent corpus for models under 10M params.

  gutenberg:
    source: huggingface
    repo: manu/project_gutenberg
    split: en
    text_field: text
    stage: pretrain
    format: text
    tokens: 5B
    license: public-domain
    description: Public-domain books. Long-form narrative structure.

  # ==========================================================================
  # Pretraining - synthetic / curriculum
  # ==========================================================================
  tinystories:
    source: huggingface
    repo: roneneldan/TinyStories
    split: train
    text_field: text
    stage: pretrain
    format: text
    tokens: 0.5B
    license: cdla-sharing-1.0
    description: >-
      Short stories using only words a 3-4 year old knows. The reference corpus
      for demonstrating that very small models can be coherent - a 1-10M model
      trained here produces grammatical, on-topic stories.

  slm-next-token-qa:
    source: local
    path: research/data/corpus/slm_next_token_qa.jsonl
    split: train
    text_field: text
    stage: pretrain
    format: text
    tokens: 0.001B
    license: research
    description: >-
      510 prompt→continuation documents derived from
      slm_next_token_dataset.json (soft 3-way next-token triples). Oversample
      in crush-glint2; use soft_labels.soft_kl_loss for the soft targets.

  cosmopedia-full:
    source: huggingface
    repo: HuggingFaceTB/cosmopedia
    config: web_samples_v2
    split: train
    text_field: text
    stage: pretrain
    format: text
    tokens: 25B
    license: apache-2.0
    description: The original Cosmopedia synthetic corpus, all seed types.

  tiny-textbooks:
    source: huggingface
    repo: nampdn-ai/tiny-textbooks
    split: train
    text_field: text
    stage: pretrain
    format: text
    tokens: 0.4B
    license: apache-2.0
    description: Synthetic textbooks in the "Textbooks Are All You Need" style.

  tiny-codes:
    source: huggingface
    repo: nampdn-ai/tiny-codes
    split: train
    text_field: response
    stage: pretrain
    format: text
    tokens: 0.5B
    license: apache-2.0
    description: Short reasoning-with-code samples across many languages.

  finepersonas:
    source: huggingface
    repo: argilla/FinePersonas-v0.1
    split: train
    text_field: persona
    stage: pretrain
    format: text
    tokens: 1B
    license: llama3
    description: >-
      21M synthetic personas. Not a training corpus by itself - use it as the
      seed set when generating your own synthetic data (see docs/data.md).

  builtin-demo:
    source: builtin
    stage: pretrain
    format: text
    tokens: 0.00002B
    license: mit
    description: >-
      A tiny corpus bundled with the package so the whole pipeline runs offline.
      Used by the smoke test and the test suite.

  # ==========================================================================
  # Supervised fine-tuning (instruction following)
  # ==========================================================================
  alpaca:
    source: huggingface
    repo: tatsu-lab/alpaca
    split: train
    stage: sft
    format: instruction
    fields: { instruction: instruction, input: input, output: output }
    tokens: 0.01B
    license: cc-by-nc-4.0
    description: The original 52K self-instruct dataset. Non-commercial license.

  alpaca-cleaned:
    source: huggingface
    repo: yahma/alpaca-cleaned
    split: train
    stage: sft
    format: instruction
    fields: { instruction: instruction, input: input, output: output }
    tokens: 0.01B
    license: cc-by-nc-4.0
    description: >-
      Alpaca with hallucinations, empty outputs and bad answers repaired.
      Prefer this over the original; the cleanup is worth several points.

  casual-conversation:
    source: huggingface
    repo: SohamGhadge/casual-conversation
    split: train
    stage: sft
    format: chat
    tokens: 0.001B
    license: unknown
    description: >-
      Short everyday dialogue. Small on its own, but valuable as a 5-10% slice:
      it stops an instruction-tuned model from answering "hey" with a five-
      paragraph essay.

  smoltalk:
    source: huggingface
    repo: HuggingFaceTB/smoltalk
    config: all
    split: train
    stage: sft
    format: chat
    tokens: 0.4B
    license: apache-2.0
    description: >-
      The SFT mixture behind SmolLM2. Purpose-built for small models: shorter
      answers, less hedging, broad task coverage. The best single SFT set here.

  ultrachat-200k:
    source: huggingface
    repo: HuggingFaceH4/ultrachat_200k
    split: train_sft
    stage: sft
    format: chat
    tokens: 0.3B
    license: mit
    description: 200K filtered multi-turn conversations. Strong dialogue coverage.

  openhermes-2.5:
    source: huggingface
    repo: teknium/OpenHermes-2.5
    split: train
    stage: sft
    format: chat
    tokens: 0.4B
    license: other
    description: 1M broad instruction samples, heavy on reasoning and code.

  dolly-15k:
    source: huggingface
    repo: databricks/databricks-dolly-15k
    split: train
    stage: sft
    format: instruction
    fields: { instruction: instruction, input: context, output: response }
    tokens: 0.004B
    license: cc-by-sa-3.0
    description: Human-written, commercially usable. Small but clean.

  slim-orca:
    source: huggingface
    repo: Open-Orca/SlimOrca
    split: train
    stage: sft
    format: chat
    tokens: 0.2B
    license: mit
    description: Deduplicated, GPT-4-verified subset of OpenOrca.

  open-platypus:
    source: huggingface
    repo: garage-bAInd/Open-Platypus
    split: train
    stage: sft
    format: instruction
    fields: { instruction: instruction, output: output }
    tokens: 0.03B
    license: other
    description: STEM and logic focused; small and high quality.

  no-robots:
    source: huggingface
    repo: HuggingFaceH4/no_robots
    split: train
    stage: sft
    format: chat
    tokens: 0.002B
    license: cc-by-nc-4.0
    description: 10K entirely human-written instructions. Excellent style anchor.

  # ==========================================================================
  # Chain-of-thought / reasoning
  # ==========================================================================
  openthoughts3:
    source: huggingface
    repo: open-thoughts/OpenThoughts3-1.2M
    split: train
    stage: cot
    format: chat
    tokens: 2B
    license: apache-2.0
    description: >-
      1.2M reasoning traces across math, code and science. The largest open CoT
      set. Traces are long, so for models under ~50M params either truncate them
      or train with `supervise_reasoning: false` and keep only the answers.

  openr1-math:
    source: huggingface
    repo: open-r1/OpenR1-Math-220k
    split: train
    stage: cot
    format: chat
    tokens: 0.5B
    license: apache-2.0
    description: 220K verified math traces distilled from DeepSeek-R1.

  gsm8k-cot:
    source: huggingface
    repo: openai/gsm8k
    config: main
    split: train
    stage: cot
    format: instruction
    fields: { instruction: question, output: answer }
    tokens: 0.003B
    license: mit
    description: Grade-school word problems with worked solutions.

  metamathqa:
    source: huggingface
    repo: meta-math/MetaMathQA
    split: train
    stage: cot
    format: instruction
    fields: { instruction: query, output: response }
    tokens: 0.06B
    license: mit
    description: Bootstrapped GSM8K/MATH rewrites. Cheap way to add math CoT.

  limo:
    source: huggingface
    repo: GAIR/LIMO
    split: train
    stage: cot
    format: chat
    tokens: 0.005B
    license: apache-2.0
    description: 817 hand-curated reasoning samples. Tiny, unusually effective.

  s1k:
    source: huggingface
    repo: simplescaling/s1K-1.1
    split: train
    stage: cot
    format: chat
    tokens: 0.003B
    license: apache-2.0
    description: 1K difficulty-filtered traces used for budget-forced reasoning.

  # ==========================================================================
  # Preference data (DPO / SPIN)
  # ==========================================================================
  ultrafeedback-binarized:
    source: huggingface
    repo: HuggingFaceH4/ultrafeedback_binarized
    split: train_prefs
    stage: preference
    format: preference
    fields: { prompt: prompt, chosen: chosen, rejected: rejected }
    tokens: 0.1B
    license: mit
    description: The default DPO dataset. GPT-4 ranked, 64K prompts.

  orca-dpo-pairs:
    source: huggingface
    repo: Intel/orca_dpo_pairs
    split: train
    stage: preference
    format: preference
    fields: { prompt: question, chosen: chosen, rejected: rejected }
    tokens: 0.02B
    license: apache-2.0
    description: 12K preference pairs from OpenOrca.

  hh-rlhf:
    source: huggingface
    repo: Anthropic/hh-rlhf
    split: train
    stage: preference
    format: preference
    fields: { chosen: chosen, rejected: rejected }
    tokens: 0.05B
    license: mit
    description: Helpfulness and harmlessness comparisons.

  helpsteer2:
    source: huggingface
    repo: nvidia/HelpSteer2
    split: train
    stage: preference
    format: preference
    tokens: 0.02B
    license: cc-by-4.0
    description: Multi-attribute ratings; binarise on the helpfulness score.

  # ==========================================================================
  # Verifiable-reward RL
  # ==========================================================================
  gsm8k-rlvr:
    source: huggingface
    repo: openai/gsm8k
    config: main
    split: train
    stage: rlvr
    format: verifiable
    fields: { prompt: question, answer: answer }
    verifier: numeric
    tokens: 0.003B
    license: mit
    description: >-
      GSM8K with the final number as ground truth. The standard RLVR starter
      task: the reward is exact numeric match, so there is no reward model to
      train and nothing to hack.

  math-competition:
    source: huggingface
    repo: hendrycks/competition_math
    split: train
    stage: rlvr
    format: verifiable
    fields: { prompt: problem, answer: solution }
    verifier: latex_answer
    tokens: 0.01B
    license: mit
    description: MATH competition problems; answers extracted from \boxed{}.

  countdown:
    source: huggingface
    repo: Jiayi-Pan/Countdown-Tasks-3to4
    split: train
    stage: rlvr
    format: verifiable
    verifier: expression
    tokens: 0.005B
    license: apache-2.0
    description: >-
      Arithmetic puzzle ("reach 24 from these numbers"). Popular for RLVR
      because reward is trivially checkable and the task is learnable by models
      as small as 30M.

  # ==========================================================================
  # Evaluation
  # ==========================================================================
  wikitext-103:
    source: huggingface
    repo: Salesforce/wikitext
    config: wikitext-103-raw-v1
    split: test
    text_field: text
    stage: eval
    format: text
    license: cc-by-sa-3.0
    description: Standard perplexity benchmark.

  hellaswag:
    source: huggingface
    repo: Rowan/hellaswag
    split: validation
    stage: eval
    format: multiple_choice
    license: mit
    description: Commonsense sentence completion, 4-way.

  arc-easy:
    source: huggingface
    repo: allenai/ai2_arc
    config: ARC-Easy
    split: test
    stage: eval
    format: multiple_choice
    license: cc-by-sa-4.0
    description: Grade-school science questions, easy split.

  arc-challenge:
    source: huggingface
    repo: allenai/ai2_arc
    config: ARC-Challenge
    split: test
    stage: eval
    format: multiple_choice
    license: cc-by-sa-4.0
    description: Grade-school science questions, hard split.

  piqa:
    source: huggingface
    repo: ybisk/piqa
    split: validation
    stage: eval
    format: multiple_choice
    license: afl-3.0
    description: Physical commonsense, 2-way.

  winogrande:
    source: huggingface
    repo: allenai/winogrande
    config: winogrande_xl
    split: validation
    stage: eval
    format: multiple_choice
    license: cc-by-4.0
    description: Pronoun resolution, 2-way. Near chance for models under ~100M.

  blimp:
    source: huggingface
    repo: nyu-mll/blimp
    config: anaphor_agreement
    split: train
    stage: eval
    format: minimal_pairs
    license: cc-by-4.0
    description: >-
      Grammatical minimal pairs. The most informative benchmark for tiny models,
      because it measures syntax rather than knowledge - a 5M model can score
      well above chance here while being at chance on ARC.

  lambada:
    source: huggingface
    repo: EleutherAI/lambada_openai
    config: en
    split: test
    stage: eval
    format: text
    license: mit
    description: Last-word prediction requiring long-range context.

# ============================================================================
# Mixtures
# ============================================================================
# Weights are sampling probabilities and are normalised automatically.
mixtures:
  smollm-corpus:
    description: >-
      The SmolLM recipe: educational web text plus synthetic textbooks. The
      default choice for pretraining anything from 10M to 500M params.
    stage: pretrain
    components:
      - { dataset: fineweb-edu-dedup, weight: 0.70 }
      - { dataset: cosmopedia-v2, weight: 0.30 }

  smollm-corpus-code:
    description: SmolLM corpus with a code slice added.
    stage: pretrain
    components:
      - { dataset: fineweb-edu-dedup, weight: 0.60 }
      - { dataset: cosmopedia-v2, weight: 0.25 }
      - { dataset: python-edu, weight: 0.15 }

  synthetic-only:
    description: >-
      Purely synthetic pretraining. Highest quality per token and the fastest
      route to a coherent sub-50M model, at the cost of narrower world coverage.
    stage: pretrain
    components:
      - { dataset: cosmopedia-v2, weight: 0.50 }
      - { dataset: tiny-textbooks, weight: 0.25 }
      - { dataset: tinystories, weight: 0.25 }

  tiny-curriculum:
    description: >-
      For models under 10M params. Simple vocabulary and short sentences only;
      throwing full web text at a model this small mostly teaches it noise.
    stage: pretrain
    components:
      - { dataset: tinystories, weight: 0.60 }
      - { dataset: simple-wikipedia, weight: 0.40 }

  reasoning-mix:
    description: Web + math + code, for models intended to be post-trained on CoT.
    stage: pretrain
    components:
      - { dataset: fineweb-edu-dedup, weight: 0.50 }
      - { dataset: cosmopedia-v2, weight: 0.20 }
      - { dataset: finemath, weight: 0.20 }
      - { dataset: python-edu, weight: 0.10 }

  crush-glint2:
    description: >-
      1.4M Glint-2 crusher mix. FineWeb-Edu carries ARC/WikiText knowledge,
      DCLM carries HellaSwag-style commonsensical text, TinyStories bootstraps
      fluency/BLiMP at tiny scale, and the soft-label QA JSON is oversampled so
      the model learns those exact prompt→answer continuations.
    stage: pretrain
    components:
      - { dataset: fineweb-edu-10bt, weight: 0.50 }
      - { dataset: dclm-100bt, weight: 0.32 }
      - { dataset: tinystories, weight: 0.15 }
      - { dataset: slm-next-token-qa, weight: 0.03 }

  sft-general:
    description: >-
      Balanced instruction tuning. The casual-conversation slice is deliberate:
      it keeps short inputs getting short answers.
    stage: sft
    components:
      - { dataset: smoltalk, weight: 0.55 }
      - { dataset: alpaca-cleaned, weight: 0.20 }
      - { dataset: no-robots, weight: 0.10 }
      - { dataset: casual-conversation, weight: 0.10 }
      - { dataset: dolly-15k, weight: 0.05 }

  sft-small:
    description: Minimal SFT mix for models under 20M params. Short answers only.
    stage: sft
    components:
      - { dataset: alpaca-cleaned, weight: 0.50 }
      - { dataset: casual-conversation, weight: 0.30 }
      - { dataset: dolly-15k, weight: 0.20 }

  cot-mix:
    description: Reasoning post-training blend.
    stage: cot
    components:
      - { dataset: openthoughts3, weight: 0.60 }
      - { dataset: openr1-math, weight: 0.25 }
      - { dataset: metamathqa, weight: 0.10 }
      - { dataset: limo, weight: 0.05 }

  preference-mix:
    description: DPO blend.
    stage: preference
    components:
      - { dataset: ultrafeedback-binarized, weight: 0.70 }
      - { dataset: orca-dpo-pairs, weight: 0.30 }

  eval-suite:
    description: The benchmarks reported by `minimodel bench --suite standard`.
    stage: eval
    components:
      - { dataset: wikitext-103, weight: 1.0 }
      - { dataset: blimp, weight: 1.0 }
      - { dataset: arc-easy, weight: 1.0 }
      - { dataset: arc-challenge, weight: 1.0 }
      - { dataset: hellaswag, weight: 1.0 }
      - { dataset: piqa, weight: 1.0 }
